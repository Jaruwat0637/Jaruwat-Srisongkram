<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-900 bg-slate-50">
    <header class="bg-white border-b border-gray-200 shadow-sm z-10 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex overflow-x-auto">
                    <nav class="flex space-x-2 md:space-x-8 h-full">
                        <a href="/dashboard" class="inline-flex items-center px-2 md:px-1 pt-1 border-b-2 text-sm font-bold transition-colors {% if request.path == '/dashboard' %}border-blue-600 text-blue-600{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
                            Dashboard
                        </a>
                        <a href="/devices" class="inline-flex items-center px-2 md:px-1 pt-1 border-b-2 text-sm font-bold transition-colors {% if request.path == '/devices' or '/devices/' in request.path %}border-blue-600 text-blue-600{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
                            Devices
                        </a>
                        <a href="/activity" class="inline-flex items-center px-2 md:px-1 pt-1 border-b-2 text-sm font-bold transition-colors {% if request.path == '/activity' %}border-blue-600 text-blue-600{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
                            Activity Log
                        </a>
                        {% if session.get('user') == 'admin01' %}
                        <a href="/admin/manage" class="inline-flex items-center px-2 md:px-1 pt-1 border-b-2 text-sm font-bold transition-colors {% if request.path == '/admin/manage' %}border-blue-600 text-blue-600{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
                            Admin Management
                        </a>
                        {% endif %}
                    </nav>
                </div>
                <div class="flex flex-col items-end justify-center gap-1 ml-4">
                    <div class="flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-full border border-gray-100">
                        <span class="text-sm font-medium text-gray-700 mr-2">{{ session.get('user', 'Admin') }}</span>
                        <a href="/logout" class="text-sm text-red-600 hover:text-red-800 font-medium transition-colors" title="Logout">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    {% if session.get('user') == 'admin01' %}
    <dialog id="password-dialog" class="w-full max-w-md rounded-xl p-0 shadow-xl backdrop:bg-slate-900/50">
        <div class="border-b border-gray-200 px-6 py-4 flex items-center justify-between">
            <h3 class="text-lg font-bold text-gray-800">Change admin01 password</h3>
            <button type="button" onclick="closePasswordDialog()" class="rounded-lg px-2 py-1 text-gray-500 hover:bg-gray-100 hover:text-gray-800" aria-label="Close dialog">✕</button>
        </div>
        <form method="POST" action="/admin/manage" class="space-y-4 p-6">
            <input type="hidden" name="action" value="change-password">
            <div>
                <label for="current-password" class="block text-sm font-medium text-gray-700 mb-1">Current password</label>
                <input id="current-password" type="password" name="current_password" autocomplete="current-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">New password</label>
                <input id="new-password" type="password" name="new_password" minlength="4" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">Confirm new password</label>
                <input id="confirm-password" type="password" name="confirm_password" minlength="4" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closePasswordDialog()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50">Cancel</button>
                <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Update password</button>
            </div>
        </form>
    </dialog>
    <script>
        const passwordDialog = document.getElementById('password-dialog');

        function openPasswordDialog() {
            passwordDialog.showModal();
            document.getElementById('current-password').focus();
        }

        function closePasswordDialog() {
            passwordDialog.close();
        }

        passwordDialog.addEventListener('click', (event) => {
            if (event.target === passwordDialog) closePasswordDialog();
        });

        {% if request.path == '/admin/manage' and error and request.form.get('action') == 'change-password' %}
        openPasswordDialog();
        {% endif %}
    </script>
    {% endif %}
    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
